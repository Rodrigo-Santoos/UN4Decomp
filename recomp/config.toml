# Patches to apply during recompilation
[patches]
# Individual instruction patches
# UN4Decomp: o analisador marcava 32 "possiveis codigos auto-modificaveis" e trocava as instrucoes
# por NOP. Eram falsos positivos: escritas normais em variaveis globais (o executavel tem codigo e
# dados no mesmo segmento). Apagar essas escritas quebrava o jogo (ex.: prioridade das threads).
instructions = []

